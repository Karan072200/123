<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Apka Munim - Logo Options</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;800;900&family=Inter:wght@700;800;900&family=Manrope:wght@800&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #F9F8F6; padding: 40px; font-family: 'Inter', sans-serif; }
  .row { display: grid; grid-template-columns: repeat(4, 512px); gap: 40px; }
  .card { display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .card .label {
    font-size: 22px; font-weight: 800; letter-spacing: 0.5px;
    color: #1C1917; padding: 8px 20px; background: white; border-radius: 999px;
    border: 2px solid #E7E5DF;
  }

  /* Base 512x512 icon */
  .icon {
    width: 512px; height: 512px;
    position: relative;
    overflow: hidden;
  }

  /* ================ OPTION A: Gold ₹ on Teal =================== */
  .opt-a {
    background: radial-gradient(circle at 30% 20%, #315C5C 0%, #2A4F4F 50%, #1F3939 100%);
    border-radius: 108px; /* Android maskable safe */
  }
  .opt-a::before {
    content: ''; position: absolute; inset: 40px;
    border: 3px solid rgba(230, 178, 94, 0.25);
    border-radius: 72px;
  }
  .opt-a .rupee {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 340px; font-weight: 800;
    color: #E6B25E;
    text-shadow: 0 10px 40px rgba(230, 178, 94, 0.5);
    letter-spacing: -8px;
  }
  .opt-a .badge {
    position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%);
    padding: 8px 20px; background: rgba(230, 178, 94, 0.15);
    border: 1.5px solid rgba(230, 178, 94, 0.4);
    border-radius: 999px;
    font-size: 20px; font-weight: 700; letter-spacing: 3px;
    color: #E6B25E;
  }

  /* ================ OPTION B: AM Monogram =================== */
  .opt-b {
    background: linear-gradient(135deg, #2A4F4F 0%, #315C5C 100%);
    border-radius: 108px;
  }
  .opt-b::after {
    content: ''; position: absolute; top: -100px; right: -100px;
    width: 300px; height: 300px;
    background: radial-gradient(circle, rgba(230, 178, 94, 0.35), transparent 70%);
    filter: blur(20px);
  }
  .opt-b .monogram {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 800;
    font-size: 240px;
    color: #F9F8F6;
    letter-spacing: -20px;
    line-height: 1;
  }
  .opt-b .monogram .a { position: relative; z-index: 2; }
  .opt-b .monogram .m {
    color: #E6B25E;
    margin-left: -20px;
    position: relative; z-index: 1;
  }
  .opt-b .dot {
    position: absolute; bottom: 90px; left: 50%; transform: translateX(-50%);
    width: 24px; height: 24px;
    background: #E6B25E; border-radius: 50%;
    box-shadow: 0 0 30px rgba(230, 178, 94, 0.6);
  }

  /* ================ OPTION C: Wallet + ₹ modern =================== */
  .opt-c {
    background: linear-gradient(160deg, #315C5C 0%, #2A4F4F 60%, #1F3939 100%);
    border-radius: 108px;
  }
  .opt-c .wallet {
    position: absolute; inset: 100px 80px;
    background: #F9F8F6;
    border-radius: 30px;
    box-shadow: inset 0 -8px 20px rgba(0,0,0,0.08), 0 20px 40px rgba(0,0,0,0.2);
  }
  .opt-c .wallet-flap {
    position: absolute; top: 60px; left: 80px; right: 80px; height: 90px;
    background: #1F3939;
    border-radius: 45px 45px 20px 20px;
  }
  .opt-c .coin {
    position: absolute; top: 220px; right: 130px;
    width: 130px; height: 130px;
    background: radial-gradient(circle at 30% 30%, #F0C97A, #E6B25E 60%, #B87F1A);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 20px rgba(0,0,0,0.25), inset 0 -4px 8px rgba(0,0,0,0.15);
    font-family: 'Space Grotesk', sans-serif;
    font-size: 80px; font-weight: 800;
    color: #F9F8F6;
    line-height: 1;
  }

  /* ================ OPTION D: Bold ₹ Badge Style =================== */
  .opt-d {
    background: #E6B25E;
    border-radius: 108px;
    position: relative;
  }
  .opt-d::before {
    content: ''; position: absolute; inset: 30px;
    background: linear-gradient(135deg, #2A4F4F 0%, #1F3939 100%);
    border-radius: 80px;
    box-shadow: inset 0 -4px 20px rgba(0,0,0,0.3);
  }
  .opt-d .rupee-big {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 800;
    font-size: 320px;
    color: #E6B25E;
    z-index: 2;
    letter-spacing: -12px;
  }
  .opt-d .ring {
    position: absolute; inset: 60px;
    border: 2px dashed rgba(230, 178, 94, 0.3);
    border-radius: 60px;
    z-index: 1;
  }
</style>
</head>
<body>

<div class="row">

  <!-- Option A -->
  <div class="card">
    <div class="icon opt-a">
      <div class="rupee">₹</div>
      <div class="badge">MUNIM</div>
    </div>
    <div class="label">OPTION A — Rupee Classic</div>
  </div>

  <!-- Option B -->
  <div class="card">
    <div class="icon opt-b">
      <div class="monogram"><span class="a">A</span><span class="m">M</span></div>
      <div class="dot"></div>
    </div>
    <div class="label">OPTION B — AM Monogram</div>
  </div>

  <!-- Option C -->
  <div class="card">
    <div class="icon opt-c">
      <div class="wallet"></div>
      <div class="wallet-flap"></div>
      <div class="coin">₹</div>
    </div>
    <div class="label">OPTION C — Wallet + Coin</div>
  </div>

  <!-- Option D -->
  <div class="card">
    <div class="icon opt-d">
      <div class="ring"></div>
      <div class="rupee-big">₹</div>
    </div>
    <div class="label">OPTION D — Badge Style</div>
  </div>

</div>

</body>
</html>
